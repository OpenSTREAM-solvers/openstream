name: MATLAB CI

on:
  push:
    branches:
      - matlab-ci
      - matlab-ci-1
      - lecorre
      - main
  workflow_dispatch:

jobs:

  tests:
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, linux, x64, matlab]

    strategy:
      # Try to run all the tests
      fail-fast: false
      # Over multiple versions
      matrix:
        matlab: ${{ 
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/matlab-ci-1') &&
          fromJSON('["R2024b", "R2025b", "R2026b"]') ||
          fromJSON('["R2026b"]')
          }}
          
    steps:

      #- name: Clean workspace
      #  run: rm -rf ./* .[^.]*

      - name: Checkout with submodules
        uses: actions/checkout@v7 
        with:
          submodules: true
          path: ./openstream

      - name: Checkout openstream-database
        uses: actions/checkout@v7
        with:
          repository: OpenSTREAM-solvers/openstream-database
          token:  ${{ secrets.ORG_REPO_TOKEN }}
          path: ./openstream-database
          ref: lecorre
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Upgrade pip
        run: |
          # install pip=>20.1 to use "pip cache dir"
          pip install --upgrade pip

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r ./openstream/+CoolPropWrapper/requirements.txt
          pip install nanobind

      # Sets up MATLAB on a GitHub-hosted runner
      #- name: Set up MATLAB
      #  uses: matlab-actions/setup-matlab@v3

      - name: Select MATLAB version
        run: |
          echo "/opt/MATLAB/${{ matrix.matlab }}/bin" >> "$GITHUB_PATH"
          
      - name: Query MATLAB version
        run: |
          echo "MATLAB:"
          which matlab
          matlab -batch "fprintf('Version: %s\n', version); fprintf('Root: %s\n', matlabroot)"

          echo
          echo "Python:"
          which python
          python --version
          python -m pip show nanobind

      - name: Debug MATLAB paths
        run: |
          matlab -batch "disp('--- SolverTest ---'); which -all SolverTest"
          matlab -batch "disp('GITHUB_WORKSPACE:'); disp('$GITHUB_WORKSPACE'); disp('MATLAB PWD:'); disp(pwd)"
          find "${GITHUB_WORKSPACE}" -type f \( -name '*Test.m' -o -name '*Tests.m' \) -print
          
      # Runs a set of commands using the runners shell
      - name: Run all tests
        uses: matlab-actions/run-tests@v3
        with:
          output-detail: verbose
          source-folder: ./openstream

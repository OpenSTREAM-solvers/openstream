name: Publish Sphinx docs to GitHub Pages

on:
  push:
    branches:
      - main
      - docs
      - lecorre

  workflow_dispatch:
    inputs:
        logLevel:
          description: 'Log level'
          required: true
          default: 'warning'
          type: choice
          options:
          - info
          - warning
          - debug

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: |
          # install pip=>20.1 to use "pip cache dir"
          pip install --upgrade pip

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r ./docs/source/requirements.txt

      - name: Make html files
        run: make html
        working-directory: ./docs

      - name: Make latex file
        id: makelatex
        run: make latex
        working-directory: ./docs

      - name: Make pdf file
        id: makepdf
        uses: xu-cheng/latex-action@v4
        working-directory: ./docs
        with:
          root_file: ./build/latex/OpenSTREAM.tex        

      #- name: Install TeXlive
      #  run: sudo apt-get update && sudo apt-get install texlive latexmk texlive-publishers texlive-science  cm-super
      #
      #- name: Make pdf file
      #  id: makepdf
      #  run: make latexpdf
      #  working-directory: ./docs

      - name: Copy pdf file
        if: steps.makepdf.outcome == 'success'
        run: mkdir -p ./build/html/files && cp ./build/latex/OpenSTREAM.pdf ./build/html/files/OpenSTREAM.pdf
        working-directory: ./docs
        
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html


